pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,mjs,json,jsonc}"
      run: pnpm exec oxfmt --check --no-error-on-unmatched-pattern {staged_files}

    - name: lint
      glob: "*.{ts,tsx,js,mjs}"
      run: pnpm exec oxlint {staged_files}

    - name: typecheck
      run: pnpm typecheck

    - name: knip
      run: pnpm knip
